# pnpm >= 10 reads `overrides` here, not from package.json's "pnpm" field.
# https://pnpm.io/settings/dependency-resolution#overrides
#
# Vite is replaced with its Rolldown-powered build. Keep this in sync with the
# `vite` devDependency specifier in package.json.
overrides:
  vite: npm:rolldown-vite@^7.3.0

# Postinstall scripts must be opted into explicitly. esbuild and workerd fetch
# the platform binaries they cannot run without; msw's only installs a browser
# worker file this app does not use.
allowBuilds:
  esbuild: true
  msw: false
  workerd: true
