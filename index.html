<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>loglog</title>
    <meta
      name="description"
      content="Veterinary-grade stool assessment. On your phone. In the rain. Holding a bag. Purina fecal scoring, local-only, works offline."
    />
    <meta name="theme-color" content="#7b4b26" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="loglog" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Resolve the theme before first paint so dark mode never flashes white.
      // This runs before React mounts and so cannot import from
      // src/lib/theme.ts; the loglog:theme-keys plugin in vite.config.ts
      // substitutes the markers below from that module and fails the build if
      // they ever go missing. Reading the same keys and applying the same
      // rule is what keeps this from disagreeing with the provider and
      // flashing the wrong theme.
      (function () {
        try {
          const themes = __THEMES__;
          const read = (key) => {
            const value = localStorage.getItem(key);
            return themes.includes(value) ? value : null;
          };
          // Validate before falling back, so a garbage value under the current
          // key does not hide a real preference under the legacy one.
          const theme = read(__THEME_STORAGE_KEY__) ?? read(__LEGACY_THEME_STORAGE_KEY__);
          const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          const resolvedTheme = theme === "dark" || theme === "light" ? theme : systemTheme;
          document.documentElement.classList.add(resolvedTheme);
        } catch (_) {
          // Storage denied (Safari private mode). React resolves it on mount.
        }
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
